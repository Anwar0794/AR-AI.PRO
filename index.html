<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR-AI Pro | AI Video Studio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020617; 
            color: #f8fafc;
            overflow-x: hidden;
            margin: 0;
        }
        .glass { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .gradient-text { 
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .btn-primary { 
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .btn-primary:active { transform: scale(0.95); }
        .btn-primary:hover { opacity: 0.9; box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4); }
        
        .loader {
            width: 24px;
            height: 24px;
            border: 3px solid #FFF;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom Input Styling */
        input:focus, textarea:focus {
            outline: none;
            border-color: #6366f1 !important;
        }
    </style>
</head>
<body>
    <div id="app-root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs, increment } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import React, { useState, useEffect } from "https://esm.sh/react@18.2.0";
        import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";

        // CONFIG FIREBASE (WAJIB DIGANTI DENGAN MILIK ANDA)
        const firebaseConfig = {
            apiKey: "AIzaSyBw-EXAMPLE-KEY", 
            authDomain: "ar-ai-app-3205a.firebaseapp.com",
            projectId: "ar-ai-app-3205a",
            storageBucket: "ar-ai-app-3205a.firebasestorage.app",
            messagingSenderId: "367258079737",
            appId: "1:367258079737:web:8e16973e6540b64c679951"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        function App() {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('landing');
            const [prompt, setPrompt] = useState('');
            const [refInput, setRefInput] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        setUser(u);
                        const userRef = doc(db, "users", u.uid);
                        const snap = await getDoc(userRef);
                        
                        if (!snap.exists()) {
                            setView('referral-check');
                        } else {
                            setUserData(snap.data());
                            setView('studio');
                        }
                    } else {
                        setUser(null);
                        setView('landing');
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            const finalizeSignup = async (referredByCode = null) => {
                const myRefCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                const newUserObj = {
                    email: user.email,
                    displayName: user.displayName,
                    credits: 10,
                    plan: 'Free',
                    myReferralCode: myRefCode,
                    referredBy: (referredByCode && referredByCode !== myRefCode) ? referredByCode : 'none',
                    createdAt: new Date().toISOString()
                };

                // Reward system
                if (referredByCode && referredByCode !== myRefCode) {
                    const q = query(collection(db, "users"), where("myReferralCode", "==", referredByCode));
                    const querySnap = await getDocs(q);
                    if (!querySnap.empty) {
                        const ownerDoc = querySnap.docs[0];
                        await updateDoc(doc(db, "users", ownerDoc.id), {
                            credits: increment(1)
                        });
                    }
                }

                await setDoc(doc(db, "users", user.uid), newUserObj);
                setUserData(newUserObj);
                setView('studio');
            };

            const copyRefCode = () => {
                if (userData?.myReferralCode) {
                    navigator.clipboard.writeText(userData.myReferralCode);
                    alert("Kode Referral disalin ke clipboard!");
                }
            };

            if (loading) return (
                <div className="h-screen flex items-center justify-center bg-[#020617]">
                    <span className="loader"></span>
                </div>
            );

            return (
                <div className="min-h-screen max-w-md mx-auto relative px-6 py-8 flex flex-col">
                    <header className="flex justify-between items-center mb-10 shrink-0">
                        <div className="flex items-center space-x-2">
                            <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-black text-white shadow-lg">A</div>
                            <h1 className="font-bold text-xl tracking-tighter text-white italic">AR-AI<span className="text-indigo-500">PRO</span></h1>
                        </div>
                        {user && userData && (
                            <div className="bg-indigo-600/20 px-4 py-1.5 rounded-full border border-indigo-500/30 text-[10px] font-black text-indigo-400 uppercase tracking-widest">
                                {userData.credits} Credits
                            </div>
                        )}
                    </header>

                    <main className="flex-1">
                        {view === 'landing' && (
                            <div className="text-center space-y-8 pt-12">
                                <div className="inline-block p-4 bg-indigo-600/10 rounded-full mb-4">
                                    <svg className="w-12 h-12 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                </div>
                                <h2 className="text-5xl font-black tracking-tighter leading-none text-white">
                                    TEXT TO <br/> <span className="gradient-text italic underline">VIDEO.</span>
                                </h2>
                                <p className="text-slate-400 text-sm font-medium leading-relaxed">Ubah kata-kata Anda menjadi visual video AI yang menakjubkan dalam sekejap.</p>
                                <button 
                                    onClick={() => signInWithPopup(auth, provider)} 
                                    className="btn-primary w-full py-5 rounded-3xl font-black text-lg text-white shadow-2xl shadow-indigo-500/20 uppercase tracking-widest"
                                >
                                    Masuk dengan Google
                                </button>
                            </div>
                        )}

                        {view === 'referral-check' && (
                            <div className="space-y-6 pt-6">
                                <div className="glass p-8 rounded-[40px] space-y-6 text-center border-indigo-500/20 border-2 shadow-2xl">
                                    <h2 className="font-black text-2xl tracking-tight text-white uppercase">Kode Promo?</h2>
                                    <p className="text-xs text-slate-400 leading-relaxed">Masukkan kode referral teman Anda untuk memberi mereka hadiah 1 Kredit gratis.</p>
                                    <input 
                                        className="w-full bg-white/5 border-2 border-white/10 p-5 rounded-2xl text-center font-black tracking-widest text-xl text-white transition-all placeholder:text-slate-700"
                                        placeholder="KODE123"
                                        value={refInput}
                                        onChange={(e) => setRefInput(e.target.value.toUpperCase())}
                                    />
                                    <button onClick={() => finalizeSignup(refInput)} className="btn-primary w-full py-5 rounded-2xl font-black text-white shadow-xl shadow-indigo-500/20 uppercase">Konfirmasi</button>
                                    <button onClick={() => finalizeSignup()} className="text-slate-500 text-xs font-bold uppercase tracking-widest pt-2 hover:text-slate-300 transition-colors">Lewati & Selesai</button>
                                </div>
                            </div>
                        )}

                        {view === 'studio' && (
                            <div className="space-y-6 pb-12">
                                <div className="glass rounded-[32px] p-6 space-y-6">
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase tracking-[0.3em] text-indigo-400">Tulis Prompt Anda</label>
                                        <textarea 
                                            className="w-full bg-transparent border-none focus:ring-0 text-xl font-bold p-0 min-h-[160px] placeholder:text-slate-800 text-white resize-none"
                                            placeholder="Gambarkan pemandangan atau aksi yang ingin Anda buat..."
                                            value={prompt}
                                            onChange={(e) => setPrompt(e.target.value)}
                                        />
                                    </div>
                                    <button 
                                        onClick={() => {
                                            if (userData.credits <= 0) return alert("Kredit tidak cukup!");
                                            setIsGenerating(true);
                                            setTimeout(() => setIsGenerating(false), 3000);
                                        }}
                                        disabled={isGenerating || !prompt}
                                        className="btn-primary w-full py-5 rounded-2xl font-black text-sm tracking-widest text-white disabled:opacity-50 shadow-lg shadow-indigo-500/20 uppercase"
                                    >
                                        {isGenerating ? <span className="loader"></span> : "Generate Video (1 CR)"}
                                    </button>
                                </div>

                                <div className="glass rounded-[32px] p-6 space-y-4 border-dashed border-2 border-indigo-500/20">
                                    <div className="flex items-center space-x-2">
                                        <h3 className="text-[10px] font-black uppercase tracking-[0.3em] text-indigo-400">Refer & Earn</h3>
                                    </div>
                                    <p className="text-xs text-slate-400 leading-relaxed italic">
                                        Dapatkan <span className="text-white font-bold">+1 Kredit</span> setiap kali teman mendaftar menggunakan kode Anda.
                                    </p>
                                    <div 
                                        onClick={copyRefCode} 
                                        className="bg-white/5 p-5 rounded-2xl border-2 border-white/5 flex justify-between items-center cursor-pointer active:scale-95 transition-all group hover:bg-white/10"
                                    >
                                        <span className="font-black text-2xl tracking-tighter text-white group-hover:text-indigo-400 transition-colors">
                                            {userData?.myReferralCode}
                                        </span>
                                        <span className="text-[10px] bg-indigo-600 text-white font-black px-4 py-2 rounded-full shadow-lg uppercase tracking-wider">Salin</span>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => signOut(auth)} 
                                    className="w-full py-4 text-[10px] font-black text-red-500/30 uppercase tracking-[0.4em] hover:text-red-500 transition-all"
                                >
                                    Keluar dari Akun
                                </button>
                            </div>
                        )}
                    </main>

                    <footer className="py-4 text-center shrink-0">
                        <p className="text-[9px] font-bold text-slate-700 uppercase tracking-widest">&copy; 2026 AR-AI PRO STUDIO</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app-root'));
        root.render(<App />);
    </script>
</body>
</html>
